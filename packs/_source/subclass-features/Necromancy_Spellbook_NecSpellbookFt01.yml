system:
  description:
    value: >
      <p>The necromantic secrets recorded in your spellbook unlock additional
      powers. You gain the following benefits.</p>

      <p><strong>Necrotic Resistance.</strong> You have Resistance to Necrotic
      damage.</p>

      <p><strong>Grim Harvest.</strong> Whenever you expend a spell slot to cast
      a Necromancy spell, you may target one Undead within 60 feet of you that
      you can see. That creature regains hit points equal to the slot's level +
      your wizard level.</p>

      <p><strong>Undead Familiar.</strong> The spell <em>Find Familiar</em>
      appears in your spellbook. When you cast it, you may pick from any of its
      standard familiar forms or from these additional forms: Skeleton or Zombie
      (statistics in Appendix B of the <em>Player's Handbook</em>).</p>
