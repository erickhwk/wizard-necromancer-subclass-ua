system:
  description:
    value: >
      <p>You always have <em>Animate Dead</em> prepared, and you may cast it
      once without expending a spell slot. You regain this free use after a Long
      Rest.</p>

      <p>When you begin casting <em>Animate Dead</em>, you may treat its
      effective level as one higher than the slot used (or than the level it
      would otherwise have, if you used the free use above).</p>

      <p>In addition, whenever a Necromancy spell you cast using a spell slot
      creates or summons one or more Undead, each such Undead gains the
      following benefits.</p>

      <p><strong>Undead Fortitude.</strong> Its hit point maximum and current
      hit points are increased by an amount equal to the spell slot's level +
      your Intelligence modifier, for the spell's duration.</p>

      <p><strong>Withering Strike.</strong> When the Undead hits a creature with
      an attack roll, it deals additional Necrotic damage equal to your
      Intelligence modifier (minimum 1).</p>
