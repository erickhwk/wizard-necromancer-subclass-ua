system:
  description:
    value: >
      <p>As a Bonus Action, while your spellbook is in hand, select any number
      of Undead within 60 feet of you that you created or summoned with a
      Necromancy spell. Each chosen Undead gains Temporary Hit Points equal to
      your wizard level.</p>

      <p><em>House rule (this implementation): you may use this feature once per
      Long Rest, in place of the per-Undead 24-hour cooldown described in the
      original UA text.</em></p>
