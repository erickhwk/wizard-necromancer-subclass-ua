system:
  description:
    value: >
      <p><strong>Trigger.</strong> An Undead creature you can see is reduced to
      0 hit points.</p>

      <p><strong>Response — Reaction.</strong> While your spellbook is in hand,
      you cause the Undead to detonate in necrotic energy. Roll a number of d6s
      equal to half its unspent Hit Dice (rounded up, minimum 1d6); sum the
      rolls.</p>

      <p>Each creature in a 10-foot Emanation originating from the dying Undead
      must succeed on a Dexterity saving throw or take Necrotic damage equal to
      the total rolled, and cannot take Reactions until the start of its next
      turn. On a successful save, a target takes half as much damage and is
      otherwise unaffected.</p>

      <p>If the Undead being detonated is not under your control, this Reaction
      also requires you to expend a level 5 or higher spell slot.</p>
