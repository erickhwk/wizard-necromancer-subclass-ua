system:
  description:
    value: >
      <p><em>You walk the boundary between life and death — not as a trespasser,
      but as a student. Where others see endings, you see the architecture of
      vitality itself: threads of force that bind the living and reach for the
      lapsed. Cultures that brand necromancy as forbidden are not always wrong,
      but they are rarely curious enough to know why.</em></p>

      <p><em>You learn to siphon those threads, refine them into raw arcane
      fuel, and lend them — briefly — to bodies the world has already finished
      with.</em></p>
