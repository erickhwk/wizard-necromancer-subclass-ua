name: Find Familiar (Undead)
system:
  description:
    value: >-
      <p>You inscribe a binding sigil and intone the names of small dead things,
      calling a spirit-fragment to inhabit a body of your choosing. The familiar
      materializes in an unoccupied space within range and takes the statistics
      of one form you select: Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat,
      Raven, Spider, Weasel, another Beast of Challenge Rating 0, or —
      channeling your necromantic art — a Skeleton or Zombie (see <em>Player's
      Handbook</em>, appendix B).</p><p>The chosen body bears the marks of its
      other-than-living origin: bone glints under fur, eyes are clouded or
      mirror-bright, skin sags in the wrong places. Despite appearances, the
      familiar's creature type is whatever you choose at casting — Celestial,
      Fey, or Fiend for the Beast forms; Undead for Skeleton or Zombie. The
      grave-aesthetic does not, by itself, define the creature's nature; only
      you know for certain what manner of thing has answered the call.</p><p>It
      moves of its own will but heeds the commands you
      give.</p><p><strong>Telepathic Connection.</strong> While the familiar is
      within 100 feet of you, you can speak to it across the distance with your
      mind alone. As a Bonus Action, you may also borrow its senses — seeing
      what it sees, hearing what it hears, and gaining the benefits of any
      special senses it has — until the start of your next turn.</p><p>When you
      cast a spell whose range is touch, the familiar can deliver that touch on
      your behalf, provided it is within 100 feet of you. Doing so costs the
      familiar its Reaction, which it spends as you complete the
      casting.</p><p><strong>Combat.</strong> The familiar fights at your side
      as an ally. It has its own Initiative and acts on its own turn. A familiar
      cannot attack, but every other action remains available to
      it.</p><p><strong>Vanishing.</strong> When the familiar is reduced to 0
      Hit Points, the binding fails and the body dissolves into ash, grave-dust,
      or rags of half-formed essence; it returns the next time you cast this
      spell. As a Magic action you may also dismiss the familiar deliberately,
      sending it to a pocket dimension that smells of old earth and waiting; a
      later Magic action recalls it to an empty space within 30 feet of you. A
      permanent dismissal severs the link entirely. In any case where the
      familiar vanishes, anything it was wearing or carrying is left behind in
      its last-occupied space.</p><p><strong>Singularity.</strong> You may have
      only one familiar at a time. Casting this spell while a familiar is
      already bound to you instead reshapes the existing one into a new eligible
      form.</p>
