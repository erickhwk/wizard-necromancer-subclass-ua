  description:
    value: >
      <p>The deepest secrets recorded in your spellbook reach past mere
      manipulation of the dead and into mastery over death itself. These
      rituals are too intricate to be carried in memory alone — they take
      shape only with the book in hand and its pages open to your command.</p>

      <p>While your spellbook is in hand, you wield two techniques over the
      boundary between life and undeath: <strong>Bolster Undead</strong> and
      <strong>Extinguish Undead</strong>, described in their own entries.</p>
